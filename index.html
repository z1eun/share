<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브코딩 활용 놀이앱 모음</title>
  
  <!-- 오케이단단체 웹폰트 적용 -->
  <style>
    @font-face {
      font-family: 'OkDandan';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2508-2@1.0/OkDanDan-Bold.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f7ebf1;
      font-family: 'OkDandan', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #3b1e32;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 45px 20px;
    }

    /* 헤더 영역 */
    .header {
      text-align: center;
      margin-bottom: 36px;
    }

    .top-icon {
      font-size: 54px;
      line-height: 1;
      margin-bottom: 12px;
      display: inline-block;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.06));
    }

    .main-title {
      font-size: 34px;
      font-weight: normal;
      color: #8c1e5b;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .sub-title {
      font-size: 14px;
      color: #947187;
      font-weight: normal;
      letter-spacing: 0.5px;
    }

    /* 카드 그리드 컨테이너 */
    .grid-container {
      width: 100%;
      max-width: 880px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    /* 개별 앱 카드 */
    .app-card {
      background-color: #ffffff;
      border: 1.8px solid #f6d1df;
      border-radius: 26px;
      padding: 26px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(220, 160, 185, 0.16);
      transition: all 0.22s ease-in-out;
      cursor: pointer;
      min-height: 125px;
    }

    .app-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 24px rgba(205, 130, 165, 0.3);
      border-color: #f1b3cb;
    }

    .card-icon {
      font-size: 40px;
      margin-bottom: 14px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-icon img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }
