<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브코딩 활용 놀이앱 모음</title>
  
  <!-- 오케이단단체 웹폰트 적용 -->
  <style>
    @font-face {
      font-family: 'OKDDAN';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2206-02@1.0/OKDDAN.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f7ebf1;
      font-family: 'OKDDAN', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #3b1e32;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 45px 20px;
    }

    /* 헤더 영역 */
    .header {
      text-align: center;
      margin-bottom: 36px;
    }

    .top-icon {
      font-size: 54px;
      line-height: 1;
      margin-bottom: 12px;
      display: inline-block;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.06));
    }

    .main-title {
      font-size: 34px;
      font-weight: normal;
      color: #8c1e5b;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .sub-title {
      font-size: 14px;
      color: #947187;
      font-weight: normal;
      letter-spacing: 0.5px;
    }

    /* 카드 그리드 컨테이너 */
    .grid-container {
      width: 100%;
      max-width: 880px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    /* 개별 앱 카드 */
    .app-card {
      background-color: #ffffff;
      border: 1.8px solid #f6d1df;
      border-radius: 26px;
      padding: 26px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(220, 160, 185, 0.16);
      transition: all 0.22s ease-in-out;
      cursor: pointer;
      min-height: 125px;
    }

    .app-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 24px rgba(205, 130, 165, 0.3);
      border-color: #f1b3cb;
    }

    .card-icon {
      font-size: 40px;
      margin-bottom: 14px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-icon img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .card-title {
      font-size: 17px;
      font-weight: normal;
      color: #8f1b5d;
      text-align: center;
      word-break: keep-all;
      line-height: 1.35;
    }

    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 0;
      color: #9c6c87;
      font-size: 17px;
    }

    /* 반응형 레이아웃 */
    @media (max-width: 768px) {
      .grid-container {
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }
      .main-title {
        font-size: 26px;
      }
      .app-card {
        padding: 20px 12px;
        min-height: 110px;
      }
      .card-title {
        font-size: 15px;
      }
      .card-icon {
        font-size: 34px;
      }
    }

    @media (max-width: 480px) {
      .grid-container {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <!-- CSV 파싱 라이브러리 (PapaParse) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

  <header class="header">
    <div class="top-icon">🧸</div>
    <h1 class="main-title">바이브코딩 활용 놀이앱 모음</h1>
    <p class="sub-title">제작: 대전성천초등학교병설유치원 교사 / 무단배포를 금지합니다</p>
  </header>

  <main class="grid-container" id="cards-container">
    <div class="status-msg">놀이앱 목록을 불러오는 중입니다... 💕</div>
  </main>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR7GkLYYfZqjohXjKb_ZyNpI86nbRnafZ3eZsbfogBHIBnF31DOXzZtCAP7HJ94bM4-0X7ZTq9QV8Ox/pub?gid=0&single=true&output=csv";

    Papa.parse(CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        renderCards(results.data);
      },
      error: function(err) {
        console.error("CSV 로드 실패:", err);
        document.getElementById('cards-container').innerHTML = 
          '<div class="status-msg">목록을 불러오지 못했습니다. 잠시 후 다시 확인해주세요.</div>';
      }
    });

    function renderCards(data) {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      if (!data || data.length === 0) {
        container.innerHTML = '<div class="status-msg">등록된 놀이앱이 없습니다.</div>';
        return;
      }

      data.forEach(item => {
        // 컬럼명 대소문자나 한글/영문 모두 대응
        const title = (item.title || item.Title || item['제목'] || '').trim();
        const icon = (item.icon || item.Icon || item['아이콘'] || '').trim();
        const url = (item.url || item.Url || item['링크'] || item['주소'] || '').trim();

        if (!title && !url) return;

        const card = document.createElement('a');
        card.className = 'app-card';
        card.href = url || '#';
        card.target = '_blank';
        card.rel = 'noopener noreferrer';

        // 아이콘 렌더링: 이미지 링크면 img 태그, 아니면 시트에 적힌 이모지 그대로 출력
        let iconMarkup = '✨';
        if (icon) {
          if (icon.startsWith('http://') || icon.startsWith('https://')) {
            iconMarkup = `<img src="${icon}" alt="${title}">`;
          } else {
            iconMarkup = icon; // 스프레드시트에 입력한 이모지가 그대로 들어갑니다.
          }
        }

        card.innerHTML = `
          <div class="card-icon">${iconMarkup}</div>
          <div class="card-title">${title}</div>
        `;

        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
